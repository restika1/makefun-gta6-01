<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Vela: Nightfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  body { display: grid; place-items: center; }
  #game {
    width: 100vw;
    height: 100vh;
    display: block;
    background: #05070d;
    cursor: crosshair;
    touch-action: none;
    image-rendering: auto;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Vela: Nightfall, an original open-world crime game"></canvas>
<p id="status" role="status" aria-live="polite">Port Vela: Nightfall. Press Enter to start.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
